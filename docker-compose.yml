services:
  firefox-rdp:
    build: .
    container_name: firefox-rdp
    ports:
      - "4000:3389"
    environment:
      RDP_USER: browser
      RDP_PASSWORD: change-me
      FIREFOX_START_URL: about:blank
      FREEZE_ON_DISCONNECT: "true"
    shm_size: "2gb"
    mem_limit: "4gb"
    restart: unless-stopped
    # Security: drop all Linux capabilities and only restore what xrdp requires.
    # setuid is needed for session helper privilege transitions,
    # dac_override for root to init profile dirs on the user-owned
    # named volume (mkdir after chown would otherwise fail with
    # "Permission denied"), dac_read_search for reading user files,
    # and net_bind_service for port 3389 binding.
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - DAC_READ_SEARCH
      - CHOWN
    # Writable rootfs required: entrypoint writes to /etc (shadow via sed),
    # /home/$user (profile init). /tmp, /var, /run are tmpfs with bounded sizes.
    tmpfs:
      - /tmp:size=512m,mode=1777
      - /var:size=128m,mode=0755
      - /run:size=64m,mode=0755
    volumes:
      - firefox-profile:/home/browser

volumes:
  firefox-profile:
